<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة دليل محكمة شمال بنها الابتدائية</title><style>
:root{--navy:#142f58;--gold:#ba9652}*{box-sizing:border-box}body{margin:0;background:#f6f5f1;font-family:Tahoma,Arial,sans-serif;color:#192a43}header{background:#142f58;color:white;text-align:center;padding:26px 15px;border-bottom:5px solid var(--gold)}h1{font-size:24px}.wrap{max-width:960px;margin:auto;padding:18px}.panel{background:white;border:1px solid #e2dfd7;padding:18px;border-radius:13px;margin:16px 0;box-shadow:0 4px 15px #0001}label{display:block;margin:12px 0 5px;font-weight:bold}input,select{width:100%;padding:12px;border:1px solid #cbd2db;border-radius:8px;font:inherit}button{background:var(--navy);color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font:inherit;margin:6px 0}.secondary{background:#edf0f4;color:#152949}.danger{background:#a62d33}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.row{border-bottom:1px solid #ececec;padding:12px 2px;display:flex;align-items:center;gap:8px;justify-content:space-between}.row span{flex:1;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none}.message{padding:12px;margin:12px 0;border-radius:8px;background:#f6f0dc;color:#584b27}.error{background:#ffe8e8;color:#8e2525}.muted{color:#6b7583;font-size:13px}a{color:#284d80}@media(max-width:600px){.grid{grid-template-columns:1fr}.row{align-items:start;flex-wrap:wrap}} header{background:linear-gradient(90deg,#102d3cdd,#102d3cc9),url('court-building.jpg') center/cover;border-color:#d2a762;min-height:188px}.admin-logo{height:74px;width:74px;object-fit:contain;border:3px solid #d2a762;background:#fff;border-radius:50%}h1{margin:10px 0 5px}.panel{border-radius:17px}.panel h2{color:#163f4b}button:not(.danger){background:#186e6d;color:white}.secondary{background:#e3efec!important;color:#174e4c!important}body{background:#f5f3ee}.message{border-inline-start:4px solid #d2a762}input:focus,select:focus{outline:2px solid #186e6d}</style></head><body>
<header><img src="justice-logo.jpg" alt="شعار وزارة العدل" class="admin-logo"><h1>لوحة إدارة الدليل الإرشادي</h1><div>محكمة شمال بنها الابتدائية</div></header><main class="wrap"><div id="status" class="message" role="status">جاري التحميل...</div>
<section id="login" class="panel"><h2>دخول المسؤول</h2><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="username"></label><label>كلمة المرور<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">تسجيل الدخول</button></form><p class="muted">هذا الحساب هو حساب مستخدم Supabase الذي أُضيف لقائمة court_admins، وليس كلمة مرور حساب GitHub.</p></section>
<section id="management" class="panel hide"><div class="actions"><button id="logout" class="secondary">تسجيل الخروج</button><button id="download" class="secondary">تصدير نسخة احتياطية JSON</button><button id="importBtn" class="secondary">استيراد بيانات JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
<h2>إضافة أو تعديل مكتب</h2><form id="officeForm"><input id="editId" type="hidden"><div class="grid"><div><label>اسم المكتب أو الجهة<input id="officeName" required maxlength="250"></label></div><div><label>الدور<select id="floor"></select></label></div></div><button type="submit">حفظ التعديل لجميع الزوار</button> <button type="button" id="clear" class="secondary">مكتب جديد</button></form><h2>المكاتب المسجلة (<span id="total">0</span>)</h2><div id="records"></div></section><p><a href="index.html">العودة إلى الدليل</a></p></main>
<script src="config.js"></script><script src="admin.js"></script></body></html>
